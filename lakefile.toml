name = "hex-number-field-tower-mathlib"
defaultTargets = ["HexNumberFieldTowerMathlib"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexRowReduceMathlib"
git = "https://github.com/leanprover/hex-row-reduce-mathlib.git"
rev = "v0.8.0"

[[require]]
name = "HexBerlekampZassenhausMathlib"
git = "https://github.com/leanprover/hex-berlekamp-zassenhaus-mathlib.git"
rev = "v0.8.0"

[[require]]
name = "HexResultantMathlib"
git = "https://github.com/leanprover/hex-resultant-mathlib.git"
rev = "v0.8.0"

[[require]]
name = "HexNumberFieldMathlib"
git = "https://github.com/leanprover/hex-number-field-mathlib.git"
rev = "v0.8.0"

[[require]]
name = "HexNumberFieldTower"
git = "https://github.com/leanprover/hex-number-field-tower.git"
rev = "v0.8.0"

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "main"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "6b7abb3c7686292736be2955bd3eb9ebf63b456a"

[[lean_lib]]
name = "HexNumberFieldTowerMathlib"
